
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarjeta de producto</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="contenedor">

        <div class="tarjeta">

            <!-- Imagen del producto -->
            <div class="imagen">
                <img src="images/image-product-desktop.jpg" alt="Perfume Gabrielle">
            </div>

            <!-- Información del producto -->
            <div class="informacion">

                <p class="categoria">PERFUME</p>

                <h1>Gabrielle Essence Eau De Parfum</h1>

                <p class="descripcion">
                    Una interpretación floral, solar y voluptuosa
                    creada por Olivier Polge, perfumista de CHANEL.
                </p>

                <!-- Precio -->
                <div class="precios">
                    <span class="precio">$149.99</span>
                    <span class="precio-anterior">$169.99</span>
                </div>

                <!-- Botón -->
                <button class="boton">
                    <img src="images/icon-cart.svg" alt="">
                    Agregar al carrito
                </button>

            </div>

        </div>

    </main>

</body>

</html>
